<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎮 Мои игры</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: #eee;
    min-height: 100vh;
    padding: 30px 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  h1 {
    font-size: 42px;
    background: linear-gradient(90deg, #4caf50, #8bc34a, #cddc39);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .subtitle {
    color: #888;
    font-size: 15px;
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
  }

  .game-card {
    background: #16213e;
    border: 2px solid #2a3a5c;
    border-radius: 16px;
    padding: 24px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    display: block;
    position: relative;
    overflow: hidden;
  }

  .game-card:hover {
    transform: translateY(-4px);
    border-color: #4caf50;
    box-shadow: 0 8px 32px rgba(76, 175, 80, 0.25);
  }

  .game-card:active {
    transform: scale(0.98);
  }

  .game-icon {
    font-size: 56px;
    margin-bottom: 12px;
    display: block;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
  }

  .game-title {
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    margin-bottom: 6px;
  }

  .game-desc {
    font-size: 13px;
    color: #999;
    line-height: 1.5;
  }

  .game-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: #e74c3c;
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .game-badge.new { background: #4caf50; }
  .game-badge.hot { background: #ff9800; }

  .footer {
    text-align: center;
    color: #555;
    font-size: 13px;
    margin-top: 50px;
  }

  @media (max-width: 500px) {
    h1 { font-size: 30px; }
    .games-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🎮 Мои игры</h1>
  <p class="subtitle">Выбирай и играй</p>
</div>

<div class="games-grid">

  <a href="snake.html" class="game-card">
    <span class="game-icon">🐍</span>
    <div class="game-title">Змейка</div>
    <div class="game-desc">Собирай яблоки, расти и не врезайся в себя</div>
    <span class="game-badge hot">1</span>
  </a>

  <a href="dino.html" class="game-card">
    <span class="game-icon">🦖</span>
    <div class="game-title">Динозаврик</div>
    <div class="game-desc">Прыгай через кактусы и ставь рекорды</div>
    <span class="game-badge new">2</span>
  </a>

  <!-- Чтобы добавить новую игру, скопируй этот блок и поменяй содержимое -->
  <!--
  <a href="tetris.html" class="game-card">
    <span class="game-icon">🧱</span>
    <div class="game-title">Тетрис</div>
    <div class="game-desc">Складывай фигуры в линии</div>
  </a>
  -->

</div>

<div class="footer">
  © 2026 Мои игры
</div>

</body>
</html>
